name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Keep in mind the project is offline by
        design and keeps its dependencies to matplotlib plus the standard
        library.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where the current behaviour is not enough.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the dashboard do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This feature works fully offline.
          required: true
        - label: This feature does not require root.
          required: true
